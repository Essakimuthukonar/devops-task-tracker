
services:
  task-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-task-tracker:v1
    container_name: task-tracker
    ports:
      - "5000:5000"
    environment:
      APP_ENV: DEV
      APP_VERSION: "1.0.0"
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
